# Personal SSH agent configuration...
#
# Unlike 1Password (which exposes a Unix socket and requires an IdentityAgent
# entry in ~/.ssh/config), Bitwarden Desktop does NOT use a socket file for its
# SSH agent. Instead it integrates at the OS level:
#
#   macOS (.dmg):  SSH_AUTH_SOCK=~/.bitwarden-ssh-agent.sock  (set in dot_zshenv.tmpl)
#   Windows:       Listens on the fixed named pipe \\.\pipe\openssh-ssh-agent,
#                  taking over from the built-in Windows OpenSSH Authentication
#                  Agent service (which must be disabled first).
#   WSL2:          No socket or pipe accessible from inside WSL. Instead, git is
#                  configured to use ssh.exe (the Windows binary) via WSL interop,
#                  which transparently routes auth and signing requests to the
#                  Bitwarden agent running on the Windows host. See dot_gitconfig.tmpl
#                  and dot_zshenv.tmpl for the sshCommand and PATH config.
#
# Because of this, no IdentityAgent directive is needed here for personal machines.
# Agent routing is handled entirely via gitconfig (core.sshCommand) and the env.
#
# Setup references:
#   Bitwarden SSH Agent (general):
#     https://bitwarden.com/help/ssh-agent/
#   Enable on Windows (disable OpenSSH service, enable in Bitwarden Desktop):
#     https://bitwarden.com/help/ssh-agent/#configure-your-system-to-use-bitwarden-ssh-agent
#   Git commit signing with Bitwarden:
#     https://bitwarden.com/help/ssh-agent/#configure-git-for-ssh-signing
#   WSL2 — configure git to use ssh.exe:
#     https://bitwarden.com/help/ssh-agent/#configure-git-for-ssh-signing
#     (see the Windows/WSL note under "Configure Git for SSH signing")
