"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_macchiato"

format = """
$username\
$hostname\
$directory\
$cmd_duration\
$character"""

add_newline = false

[directory]
style = "blue"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

# todo: this is copied into starship.toml too...
[palettes.catppuccin_macchiato]
black = "#494d64"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
purple = "#c6a0f6"
cyan = "#8bd5ca"
white = "#cad3f5"
"bright-black" = "#5b6078"
"bright-red" = "#ec7486"
"bright-green" = "#8bd5ca"
"bright-yellow" = "#f0c6a2"
"bright-blue" = "#78a1f6"
"bright-purple" = "#f0abfc"
"bright-cyan" = "#91d7e3"
"bright-white" = "#b8c0e0"
